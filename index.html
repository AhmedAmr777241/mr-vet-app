<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>Mr VET Academy | تحميل التطبيق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px 30px; border-radius: 20px; text-align: center; max-width: 450px; width: 100%; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        h1 { font-size: 28px; margin-bottom: 15px; color: #38bdf8; }
        p { font-size: 16px; color: #94a3b8; margin-bottom: 30px; line-height: 1.6; }
        .download-btn { display: inline-block; background: #0284c7; color: #ffffff; padding: 15px 35px; font-size: 18px; font-weight: 700; text-decoration: none; border-radius: 50px; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); }
        .download-btn:hover { background: #0ea5e9; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(14, 165, 233, 0.6); }
        .footer { margin-top: 30px; font-size: 13px; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mr VET Academy</h1>

        <div class="footer">&copy; 2026 Mr VET Academy. جميع الحقوق محفوظة.</div>
    </div>
</body>
</html>
