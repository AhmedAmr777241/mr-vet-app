<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة منسقة بألوان مبهجة</title>
    <style>
        body {
            font-family: "Google Sans", "Roboto", Tahoma, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            color: #2c3e50;
            margin: 0;
            padding: 40px; /* ضبط الهوامش الخارجية للشاشة */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            padding: 30px 40px; /* تظبيط هوامش المحتوى الداخلية */
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            max-width: 800px;
            width: 100%;
            border: 3px solid #ff758c;
        }

        h1 {
            color: #ff758c;
            text-align: center;
            margin-bottom: 20px;
            font-size: 2.2rem;
        }

        p {
            line-height: 1.8;
            font-size: 1.1rem;
            color: #34495e;
            margin-bottom: 15px;
        }

        .highlight-box {
            background-color: #fff1f2;
            border-right: 5px solid #ff4757;
            padding: 15px 20px;
            margin: 20px 0;
            border-radius: 8px;
            color: #2f3542;
        }

        .btn-joy {
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 117, 140,.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: block;
            margin: 20px auto 0 auto;
        }

        .btn-joy:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.6);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مرحباً بك!</h1>
        <p>تم إعادة ترتيب العناصر وضبط الهوامش بدقة لضمان راحة العين وتناسق المسافات بين النصوص والأزرار.</p>
        
        <div class="highlight-box">
            <strong>ملاحظة هامة:</strong> تم استخدام تدرجات لونية حيوية وجذابة لإضفاء مظهر مبهج ومشرق على الصفحة.
        </div>

        <p>يمكنك الآن استخدام هذا الكود المحدث مباشرة للحصول على أفضل تجربة بصرية وتنسيق مرتب.</p>
        
        <button class="btn-joy">اضغط هنا للمتابعة</button>
    </div>

</body>
</html>
